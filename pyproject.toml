[project]
name = "smart-deorbit"
version = "1.0.0"
description = "Physics-Informed Neural Networks for Satellite De-orbit Optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SMART-DEORBIT Team"}
]
keywords = [
    "orbital-mechanics",
    "physics-informed-neural-networks",
    "space-debris",
    "deorbit",
    "isro",
    "pytorch",
    "aerospace"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "trackio>=0.1.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "fpdf2>=2.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
smart-deorbit = "run_demo:main"

[project.urls]
Homepage = "https://github.com/your-org/smart-deorbit"
Documentation = "https://github.com/your-org/smart-deorbit#readme"
Repository = "https://github.com/your-org/smart-deorbit.git"
Issues = "https://github.com/your-org/smart-deorbit/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
